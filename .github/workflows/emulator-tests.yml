name: Emulator Tests

on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Required for Android emulator hardware acceleration on GitHub runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          avd-name: claw-test-avd
          force-avd-creation: false
          # -no-window + -gpu swiftshader_indirect are required on headless CI
          # runners; without them the emulator hangs initializing a display/GPU
          # and never reaches boot_completed.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Run the suite (don't abort on a failed assertion — we still want the
          # screenshot tour's output), then pull the captured PNGs off the device
          # and dump each as base64 into the log so the UI can be reviewed even
          # without artifact download access.
          script: |
            ./gradlew :app:connectedDebugAndroidTest --info || echo "GRADLE_TESTS_NONZERO"
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.androidclaw.app/files/screenshots/. screenshots/ || true
            echo "===SCREENSHOTS_BEGIN==="
            find screenshots -name "*.png" -type f | sort | while read -r f; do
              echo "===IMG_NAME:$(basename "$f")"
              base64 -w0 "$f"
              printf "\n===IMG_END\n"
            done
            echo "===SCREENSHOTS_END==="

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
            screenshots/
          retention-days: 14
