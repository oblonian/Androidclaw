name: Emulator Tests

on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Required for Android emulator hardware acceleration on GitHub runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          avd-name: claw-test-avd
          force-avd-creation: false
          # -no-window + -gpu swiftshader_indirect are required on headless CI
          # runners; without them the emulator hangs initializing a display/GPU
          # and never reaches boot_completed.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Run tests (don't abort on failure so we still get screenshots),
          # then pull PNGs via the helper script (single-file avoids the
          # per-line sh -c limitation of emulator-runner's script block).
          script: |
            ./gradlew :app:connectedDebugAndroidTest --info || echo "GRADLE_TESTS_NONZERO"
            sh scripts/screenshot-pull.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            screenshots/
          retention-days: 14
