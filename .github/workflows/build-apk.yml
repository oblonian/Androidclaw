name: Build APK

on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: ./gradlew :core-gateway:test

      - name: Build debug APK
        # Run number → versionCode so each rolling build supersedes the previous;
        # the committed keystore keeps the signature stable so it installs over the
        # last build without an uninstall.
        run: ./gradlew :app:assembleDebug -PclawVersionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidclaw-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --prerelease \
            --title "AndroidClaw latest debug build" \
            --notes "Rolling debug build from CI. Install on Android 10+." || true
          gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
