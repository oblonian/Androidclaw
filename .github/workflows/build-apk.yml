name: Build APK

on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: ./gradlew :core-gateway:test

      - name: Build debug APK
        # Run number → versionCode so each rolling build supersedes the previous;
        # the committed keystore keeps the signature stable so it installs over the
        # last build without an uninstall.
        run: ./gradlew :app:assembleDebug -PclawVersionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: androidclaw-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate one-click install scripts that flag the app as Play-Store-origin.
          # This bypasses Android 13+ "Restricted settings" — without it, sideloaded apps
          # can't enable Accessibility Service through the normal Settings UI.
          cat > install.sh << 'EOF'
          #!/bin/bash
          # AndroidClaw — first-time or update install
          # Sets Google Play as the installer so Android 13+ doesn't flag the app
          # as "Restricted setting", allowing Accessibility Service to be enabled.
          echo "Installing AndroidClaw..."
          adb install -r -i com.android.vending app-debug.apk && \
            echo "Done! Open AndroidClaw and complete setup." || \
            echo "FAILED — make sure USB debugging is on and the phone is connected."
          EOF
          chmod +x install.sh

          cat > install.bat << 'EOF'
          @echo off
          echo Installing AndroidClaw...
          adb install -r -i com.android.vending app-debug.apk
          if %ERRORLEVEL% EQU 0 (
            echo Done! Open AndroidClaw and complete setup.
          ) else (
            echo FAILED -- make sure USB debugging is on and the phone is connected.
          )
          pause
          EOF

          gh release create latest --prerelease \
            --title "AndroidClaw latest debug build" \
            --notes "Rolling debug build from CI. Install on Android 10+. Run install.sh (Mac/Linux) or install.bat (Windows) to bypass Android 13 Restricted Settings." || true
          gh release upload latest \
            app/build/outputs/apk/debug/app-debug.apk \
            install.sh \
            install.bat \
            --clobber
